name: CI Pipeline

on:
  push:
    branches:
      - main
      - payment-service

jobs:
  build-test-sonarqube-docker:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd="kafka-topics --bootstrap-server localhost:9092 --list || exit 1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: ${{ secrets.PAYMENT_DB_URL }}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
      RANDOM_API_URL: ${{ secrets.RANDOM_API_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..30}; do
            nc -z localhost 27017 && break
            echo "Waiting..."
            sleep 2
          done

      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka..."
          for i in {1..30}; do
            nc -z localhost 9092 && break
            echo "Waiting..."
            sleep 3
          done

      - name: Run tests
        run: mvn test

      - name: SonarQube analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=oldvabik_marketplace-payment-service \
            -Dsonar.organization=oldvabik \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t paymentservice-app .
          docker save paymentservice-app -o paymentservice-app.tar

      - name: Save Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: paymentservice-docker-image
          path: ./paymentservice-app.tar
